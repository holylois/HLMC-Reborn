# /etc/needrestart/conf.d/holylois.conf
# Unattended OS upgrades must never restart the game server: on 2026-10-16 an OpenSSH update made needrestart stop
# minecraft.service without a countdown. Game restarts go through hl-deploy (countdown, backup, rollback) or the owner.
# The bot and stats pick up new libraries on their next planned restart.
$nrconf{override_rc}{qr(^minecraft\.service$)} = 0;
$nrconf{override_rc}{qr(^holylois-.+\.service$)} = 0;

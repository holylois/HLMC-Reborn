name: Server tools and release docs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Terrain pregeneration controller
        run: python server/terrain/test-expand-terrain.py
      - name: Deploy kit, lag watch and off-site backup
        run: python server/ops/test-ops.py
      - name: Native backup selection and exact snapshot reconstruction
        working-directory: server/ops
        run: python -m unittest test_recovery_chain test_restore_payload test_recovery_set
      - name: Release docs name the current versions
        run: python scripts/check_versions.py

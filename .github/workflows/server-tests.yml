name: Server tools and release docs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Terrain pregeneration controller
        run: python server/terrain/test-expand-terrain.py
      - name: Deploy kit, lag watch and off-site backup
        run: python server/ops/test-ops.py
      - name: Native backup selection and exact snapshot reconstruction
        working-directory: server/ops
        run: python -m unittest test_recovery_chain test_restore_payload test_recovery_set test_recovery_guard test_guard_snapshot test_guard_checkpoint test_privacy_review test_privacy_exports test_privacy_actions test_privacy_bindings test_privacy_start test_privacy_evidence test_privacy_backup test_privacy_restore test_privacy_prestart
      - name: Release docs name the current versions
        run: python scripts/check_versions.py
